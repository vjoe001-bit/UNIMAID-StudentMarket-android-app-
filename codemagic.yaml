workflows:
  android-release:
    name: UNIMAID StudentMarket - Release Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - unimaid_keystore
      groups:
        - supabase_config
      vars:
        PACKAGE_NAME: "com.aistudio.unimaidmarket.kzvptx"
      java: 21
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
        - pattern: release/*
          include: true
          source: true
    scripts:
      - name: Set up environment
        script: |
          set -e
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "$SUPABASE_URL" ]; then
            sed -i.bak '/^SUPABASE_URL=/d' .env || true
            echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i.bak '/^SUPABASE_ANON_KEY=/d' .env || true
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          fi
          rm -f .env.bak
          chmod +x gradlew

      - name: Verify release signing credentials
        script: |
          set -e
          echo "Checking CodeMagic Android release keystore..."
          if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Android release keystore was not found at CM_KEYSTORE_PATH." >&2
            echo "Please ensure the keystore with reference name 'unimaid_keystore' is uploaded in CodeMagic under Team Settings > Code signing identities > Android keystores." >&2
            exit 1
          fi
          if [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ]; then
            echo "ERROR: CM_KEYSTORE_PASSWORD or CM_KEY_ALIAS is missing from CodeMagic signing configuration." >&2
            exit 1
          fi
          echo "Keystore verified at $CM_KEYSTORE_PATH for key alias $CM_KEY_ALIAS."

      - name: Build release APK
        script: |
          set -e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        script: |
          set -e
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Release APK artifact not found." >&2
            exit 1
          fi
          APKSIGNER=$(which apksigner 2>/dev/null || find "${ANDROID_SDK_ROOT:-/opt/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signature using $APKSIGNER..."
            "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"
            echo "Release APK signature verification succeeded."
          else
            echo "Notice: apksigner not found in path, skipping signature inspection."
          fi

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/**/mapping.txt

    publishing:
      email:
        recipients:
          - victoriadrambi001@gmail.com
        notify:
          failure: true
          success: true

  android-debug:
    name: UNIMAID StudentMarket - Debug Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups:
        - supabase_config
      vars:
        PACKAGE_NAME: "com.aistudio.unimaidmarket.kzvptx"
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Set up environment
        script: |
          set -e
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "$SUPABASE_URL" ]; then
            sed -i.bak '/^SUPABASE_URL=/d' .env || true
            echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i.bak '/^SUPABASE_ANON_KEY=/d' .env || true
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          fi
          rm -f .env.bak
          chmod +x gradlew

      - name: Build debug APK
        script: |
          set -e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - victoriadrambi001@gmail.com
        notify:
          failure: true
          success: true
